[App]
# prod : mode normal | dev : mode debug Symfony (barre de debug, erreurs détaillées)
env = prod

[Database]
# false : télécharge les données et génère les CSV sans utiliser MySQL
enabled       = true
host          = mysql
user          = test_user
password      = simplepass
database      = mkmpy_db
port          = 3306
# Mot de passe root MySQL (utilisé uniquement par docker-start.sh)
root_password = rootpass

[Folders]
# Dossier persistant (volume Docker app_data) : CSV d'import et modèles IA
temp       = /data/

[Logging]
# WARNING : n'affiche que les anomalies et erreurs
# INFO    : affiche aussi le déroulé complet (téléchargements, imports, matching)
level    = WARNING

[Browser]
# Version majeure de Chromium à forcer pour undetected-chromedriver
# chrome_version = 149

[IA]
# Arbres dans la forêt
n_estimators=200
# Profondeur max des arbres
max_depth=15
# Min échantillons pour diviser un nœud
min_samples_split=5
# Min échantillons pour une feuille
min_samples_leaf=2
# Features à considérer pour split optimal
max_features=sqrt
# Cœurs CPU (-1 = tous)
n_jobs=-1
# Seed pour reproductibilité
random_state=42
