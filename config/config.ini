[Database]
host     = mysql
user     = test_user
password = simplepass
database = mkmpy_db
port     = 3306

[Folders]
temp       = /tmp/

[IA]
# Arbres dans la forêt
n_estimators=200
# Profondeur max des arbres
max_depth=15
# Min échantillons pour diviser un nœud
min_samples_split=5
# Min échantillons pour une feuille
min_samples_leaf=2
# Features à considérer pour split optimal
max_features=sqrt
# Cœurs CPU (-1 = tous)
n_jobs=-1
# Seed pour reproductibilité
random_state=42